name: scan

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job id (set by the app)
        required: true
      country:
        required: true
      city:
        required: true
      categories:
        description: Comma separated category keys
        required: true
      limit:
        default: "100"
      running_only:
        description: Skip dead websites and closed businesses
        default: "true"
      old_only:
        description: Only websites with old or problem signs
        default: "true"

permissions:
  contents: write

concurrency:
  group: leadscout-data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run scanner
        run: node scraper/scan.mjs
        env:
          JOB_ID: ${{ inputs.job_id }}
          COUNTRY: ${{ inputs.country }}
          CITY: ${{ inputs.city }}
          CATEGORIES: ${{ inputs.categories }}
          LIMIT: ${{ inputs.limit }}
          RUNNING_ONLY: ${{ inputs.running_only }}
          OLD_ONLY: ${{ inputs.old_only }}
      - name: Save results
        run: |
          git config user.name "leadscout-bot"
          git config user.email "leadscout-bot@users.noreply.github.com"
          git add data
          git commit -m "scan ${{ inputs.job_id }}" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push && break
            sleep 5
          done
